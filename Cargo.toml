[package]
name = "squeezer"
version = "0.1.0"
edition = "2024"

[workspace]
# The root package is implicitly a workspace member, so only the two support
# packages need listing. The `dds` build script resolves the vendored sources
# as `../vendor/dds`, which is why the members keep their current locations.
members = ["dds", "squeezer_macros"]
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
log = { version = "*" }
rand = "*"
colored = "*"
itertools = "*"
serde = { version = "1.0", features = ["derive"], optional = true }
reqwest = { version = "*", features = ["cookies", "blocking"], optional = true }
time = { version = "*", optional = true }
dds = { path = "dds", optional = true }
bitvec = { version = "*", features = ["atomic", "std"] }
nom = {version = "8.0.0", optional=true}
scraper = { version = "0.27.0", optional = true }
url = { version = "2.5.8", optional = true }
rayon = "1.12.0"
thiserror = "2"

[features]
default = ["lin", "pbn", "dds", "bbo_async"]
# Both BBO clients share reqwest (async + blocking), scraper for HTML parsing
# and url for resolving the relative hand-record links.
bbo = ["dep:time", "dep:reqwest", "dep:scraper", "dep:url"]
bbo_async = ["dep:time", "dep:reqwest", "dep:scraper", "dep:url"]
lin = ["dep:nom"]
pbn = ["dep:nom"]
dds = ["dep:dds"]
serde = ["dep:serde", "dds?/serde", "bitvec/serde"]

[dev-dependencies]
criterion = { version = "*", features = ["html_reports"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
# Only used by the feature-gated round-trip tests.
serde_json = "1.0"

[[bench]]
name = "bench_payoff"
harness = false
required-features = ["dds"]

[[bench]]
name = "bench_leadsim"
harness = false
required-features = ["dds"]

[[bench]]
name = "deck_pick_performance"
harness = false

[[bench]]
name = "bench_handdescriptor"
harness = false

[[bench]]
name = "simd_benchmark"
harness = false
required-features = ["dds"]

[[bench]]
name = "trick_winner_bench"
harness = false
required-features = ["dds"]

[[bench]]
name = "dds_conversion"
harness = false
required-features = ["dds"]

[[bench]]
name = "deal_constraints"
harness = false

[[bench]]
name = "simulation_paths"
harness = false
required-features = ["dds"]

# The pipeline test parses a LIN fixture, so it needs the importer as well as
# the solver; the benches above need only `dds`.
[[test]]
name = "performance_analysis_test"
required-features = ["dds", "lin"]

# The importer is gated on `lin`; without it `linparser` does not exist.
[[test]]
name = "lin_parser"
required-features = ["lin"]

# The importer is gated on `pbn`; without it `pbnparser` does not exist.
[[test]]
name = "pbn_parser"
required-features = ["pbn"]
