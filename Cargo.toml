[workspace]
# There is no root package and no umbrella crate: each vocabulary has exactly
# one home under `crates/`. The `dds` build script resolves the vendored sources
# as `../vendor/dds`, so that member and `squeezer_macros` keep their current
# locations.
members = [
    "crates/squeezer-bbo",
    "crates/squeezer-cards",
    "crates/squeezer-io",
    "crates/squeezer-model",
    "crates/squeezer-sim",
    "crates/squeezer-solver",
    "dds",
    "squeezer_macros",
]
resolver = "3"
