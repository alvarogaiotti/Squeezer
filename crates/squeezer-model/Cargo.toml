[package]
name = "squeezer-model"
version = "0.1.0"
edition = "2024"

[features]
# Serialisation stays opt-in: a consumer that only generates and checks hands
# does not compile the derive machinery, nor `bitvec`'s serde support.
default = []
serde = ["dep:serde", "bitvec/serde", "squeezer-cards/serde"]

[dependencies]
# The dealer draws through the card samplers, so this crate turns on the cards
# crate's optional `rand`.
squeezer-cards = { path = "../squeezer-cards", features = ["rand"] }
# Kept in the cards crate's major line: the dealer hands `rand::rng()` to the
# cards samplers, so both crates must agree on the `Rng` trait.
rand = "0.9"
bitvec = { version = "*", features = ["atomic", "std"] }
itertools = "*"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
# The deal serde round-trip tests serialise to JSON.
serde_json = "1.0"
