[package]
name = "squeezer-cards"
version = "0.1.0"
edition = "2024"

[features]
# Neither dependency is part of the core vocabulary: a consumer that only
# parses and compares cards does not compile `rand`, and one that never
# serialises does not compile `serde`. `squeezer-model` enables `rand` because
# its dealer draws from the samplers.
default = []
rand = ["dep:rand"]
serde = ["dep:serde"]

[dependencies]
rand = { version = "*", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "*", features = ["html_reports"] }

# The sampler tests and the distribution check only exist when `rand` is on;
# the sampling benchmark measures the same feature-gated methods.
[[test]]
name = "sampler_choice"
required-features = ["rand"]

[[test]]
name = "uniformity_check"
required-features = ["rand"]

[[bench]]
name = "deck_pick_performance"
harness = false
required-features = ["rand"]
