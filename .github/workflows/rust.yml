name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        # The `dds` member compiles the solver from `vendor/dds`.
        submodules: recursive
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run fmt
      run: cargo fmt --all --check
